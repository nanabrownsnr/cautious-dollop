services:
  cautious-dollop:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
    - PORT=8000
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 5s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 5s
    ports:
    - 8003:8000
    restart: unless-stopped
